<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Easy Settings · Tachyon</title>
<link rel="icon" href="favicon.ico">
<!--
  The TV's Easy Settings QR code opens this page (user, 2026-10-22: "what a scan shows should look professional, and
  still open the settings"): a phone's camera names gmpatel.github.io instead of a bare address. The TV's address is in
  the part after "#", which never leaves the phone; the page checks it is a home-network address with a Tachyon code
  and goes straight there. Native: ui/components/SettingsQr.kt qrLink.
-->
<style>
  :root { color-scheme: dark; --bg: #07080d; --fg: #eef0f6; --muted: #9aa1b2; --line: rgba(255,255,255,.1); --a: #7c5cff; --b: #22d3ee }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 0%, rgba(124,92,255,.22), transparent 70%), var(--bg); color: var(--fg); font: 15px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px }
  .card { width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--line); border-radius: 24px; padding: 32px 22px 26px; background: rgba(255,255,255,.03) }
  .logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin: 0 auto 14px }
  .brand { letter-spacing: .32em; font-weight: 800; font-size: 13px; color: var(--muted) }
  h1 { margin: 6px 0 4px; font-size: 24px }
  p { margin: 6px 0; color: var(--muted) }
  .ring { width: 34px; height: 34px; margin: 18px auto 6px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--b); animation: s 1s linear infinite }
  @keyframes s { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none } }
  a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding: 12px 20px; border-radius: 14px; background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; font-weight: 700; text-decoration: none; min-width: 220px }
  .addr { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); word-break: break-all }
  .bad { color: #fda4af }
  [hidden] { display: none !important }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="img/icon-512.png" alt="">
  <div class="brand">TACHYON</div>
  <h1>Easy Settings</h1>
  <div id="go">
    <p>Opening your TV’s settings…</p>
    <div class="ring" aria-hidden="true"></div>
    <a class="btn" id="open" href="#">Open TV Settings</a>
    <p class="addr" id="addr"></p>
    <p>Your phone needs to be on the same Wi-Fi as the TV, with the TV’s Settings → About page open.</p>
  </div>
  <div id="none" hidden>
    <p class="bad">This link doesn’t name a TV.</p>
    <p>On the TV, open Settings → About and scan the Easy Settings code again.</p>
  </div>
</main>
<script>
  // only a home-network address with a Tachyon code (and an optional section) — never anywhere else
  const t = decodeURIComponent(location.hash.slice(1))
  const ok = /^((10|127)\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}):\d{2,5}\/\d{3}-\d{3}(\/[a-z]{3,12})?$/.test(t)
  if (ok) {
    const url = 'http://' + t
    document.getElementById('open').href = url
    document.getElementById('addr').textContent = url
    location.replace(url)
  } else {
    document.getElementById('go').hidden = true
    document.getElementById('none').hidden = false
  }
</script>
</body>
</html>
